name: Deploy Backend to EC2

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Get the latest project code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build image using the root Dockerfile and push it
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: sahilprogrammer/ecom-app-3:latest

      # Connect to EC2 and deploy the updated image
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Pulling latest Docker image..."

            sudo docker pull sahilprogrammer/ecom-app-3:latest

            echo "Stopping existing backend..."

            sudo docker rm -f ecom-backend 2>/dev/null || true

            OLD_CONTAINER=$(sudo docker ps -q --filter "publish=8080")

            if [ -n "$OLD_CONTAINER" ]; then
              sudo docker stop $OLD_CONTAINER
              sudo docker rm $OLD_CONTAINER
            fi

            echo "Starting updated backend..."

            sudo docker run -d \
              --name ecom-backend \
              --restart unless-stopped \
              --env-file /home/ec2-user/.env \
              -p 8080:8080 \
              sahilprogrammer/ecom-app-3:latest

            echo "Deployment successful!"

            sudo docker ps
